name: uv-install
description: Set up Python and uv

inputs:
  python-version:
    description: Python version, such as 3.12 or 3.12.7
    required: true

runs:
  using: composite
  steps:
    - name: Install uv and set the python version
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.0"
        python-version: ${{ inputs.python-version }}

    - name: Install requested Python
      shell: bash
      run: uv python install "$UV_PYTHON"
